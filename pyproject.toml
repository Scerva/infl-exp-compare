[project]
name = "infl-exp-compare"
version = "0.1.0"
description = "Which measure of inflation expectations does the Federal Reserve respond to most? Reproducible research pipeline."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pyarrow>=16.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
nlp = [
    "transformers>=4.40",
    "torch>=2.2",
    "sentence-transformers>=2.6",
]
econometrics = [
    "linearmodels>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
