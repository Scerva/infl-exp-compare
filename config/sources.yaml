    release_timing_method: scheduled_release
    target_anchor: 2.0
    notes: "Median across professional forecasters; long-run anchoring gauge."

  - source_family: professional
    series_name: "SPF CPI Inflation, 5-Year Median"
    series_id: CPI5YR
    provider: PHILLYFED
    horizon_months: 60
    inflation_concept: cpi
    frequency: quarterly
    units: percent
    availability_start: "2005-07-01"
    download_method: "src.data.philly_spf.get_spf_series"
    release_timing_method: scheduled_release
    target_anchor: 2.0
    notes: "See CPI10."

  - source_family: professional
    series_name: "SPF PCE Inflation, 10-Year Median"
    series_id: PCE10
    provider: PHILLYFED
    horizon_months: 120
    inflation_concept: pce
    frequency: quarterly
    units: percent
    availability_start: "2007-01-01"
    download_method: "src.data.philly_spf.get_spf_series"
    release_timing_method: scheduled_release
    target_anchor: 2.0
    notes: "PCE concept matches the FOMC's own mandate variable most directly."

  - source_family: professional
    series_name: "SPF PCE Inflation, 5-Year Median"
    series_id: PCE5YR
    provider: PHILLYFED
    horizon_months: 60
    inflation_concept: pce
    frequency: quarterly
    units: percent
    availability_start: "2007-01-01"
    download_method: "src.data.philly_spf.get_spf_series"
    release_timing_method: scheduled_release
    target_anchor: 2.0
    notes: "See PCE10."

  - source_family: professional
    series_name: "SPF PCE Inflation, 1-Year"
    series_id: PCE1YR
    provider: PHILLYFED
    horizon_months: 12
    inflation_concept: pce
    frequency: quarterly
    units: percent
    availability_start: "2007-01-01"
    download_method: "src.data.philly_spf.get_spf_series"
    release_timing_method: scheduled_release
    target_anchor: 2.0
    notes: "Proxied by the SPF 'PCEB' column (next-calendar-year average headline PCE forecast)."

  - source_family: professional
    series_name: "SPF CPI Inflation, 1-Year"
    series_id: CPI1YR
    provider: PHILLYFED
    horizon_months: 12
    inflation_concept: cpi
    frequency: quarterly
    units: percent
    availability_start: "1981-07-01"
    download_method: "src.data.philly_spf.get_spf_series"
    release_timing_method: scheduled_release
    target_anchor: 2.0
    notes: >
      Proxied by the SPF "CPIB" column (next-calendar-year average headline
      CPI forecast) from the Median_CPI_Level.xlsx file, since that file's
      CPI1..CPI6 columns are noisier quarter-ahead annualized rates rather
      than a genuine one-year-ahead point forecast.

  - source_family: professional
    series_name: "Livingston Survey 10-Year CPI Inflation"
    series_id: LIV_CPI10
    provider: PHILLYFED
    horizon_months: 120
    inflation_concept: cpi
    frequency: semiannual
    units: percent
    availability_start: "1990-01-01"
    download_method: "src.data.livingston.get_livingston_series"
    release_timing_method: scheduled_release
    target_anchor: 2.0
    notes: >
      Oldest continuous US professional-forecaster survey (since 1946 for
      some variables); semiannual (June/December), so deliberately excluded
      from high-frequency regressions as a dominant regressor -- used as a
      long-history robustness/cross-check series only.

business:
  - source_family: business
    series_name: "Atlanta Fed Business Inflation Expectations, Year-Ahead Unit Costs"
    series_id: ATL_BIE_YOY
    provider: ATLANTAFED
    horizon_months: 12
    inflation_concept: prices_in_general
    frequency: monthly
    units: percent
    availability_start: "2011-10-01"
    download_method: "src.data.atlanta_bie.get_atlanta_bie"
    release_timing_method: scheduled_release
    target_anchor: null
    notes: >
      Firms' expected year-ahead unit cost growth from the Atlanta Fed BIE
      survey. Public chart-pack/series extraction only; de-identified
      microdata requires a separate researcher request and is out of scope.
      OPTIONAL module -- pipeline must not fail if unavailable.

