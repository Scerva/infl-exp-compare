    download_method: "src.data.fomc.get_minutes"
    release_timing_method: scheduled_release
    target_anchor: null
    notes: "Retains both meeting/decision date and minutes publication date (~3 weeks later)."

  - source_family: communications
    series_name: "FOMC Statements"
    series_id: FOMC_STATEMENTS
    provider: FEDERALRESERVE
    horizon_months: null
    inflation_concept: null
    frequency: "8x/year"
