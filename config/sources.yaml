    series_id: FRB_SPEECHES
    provider: FEDERALRESERVE
    horizon_months: null
    inflation_concept: null
    frequency: irregular
    units: null
    availability_start: "1996-01-01"
    download_method: "src.data.fed_speeches.get_speeches"
    release_timing_method: same_day
    target_anchor: null
    notes: >
      Covers Board of Governors members reliably; regional Reserve Bank
      president speeches are NOT comprehensively archived here (coverage
      selection issue -- documented, see README). Architecture supports
      later bank-specific adapters.

  - source_family: communications
    series_name: "FOMC Minutes"
    series_id: FOMC_MINUTES
    provider: FEDERALRESERVE
    horizon_months: null
    inflation_concept: null
    frequency: "8x/year"
    units: null
